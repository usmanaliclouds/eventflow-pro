# Render Blueprint: one free web service runs the API and serves the website.
services:
  - type: web
    name: eventflow-pro
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_DEMO
        value: "1"
